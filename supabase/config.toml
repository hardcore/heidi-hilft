# Supabase-Konfiguration für Heidi
# Entscheidungen aus PROJ-1 (siehe features/PROJ-1-...md, Decision Log)

project_id = "heidi-hilft"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# Zugänge entstehen nur durch Einladung. Niemand registriert sich selbst –
# im MVP legt AWSMD Betriebe und den ersten Admin an.
enable_signup = false
enable_anonymous_sign_ins = false

# Zugriffstoken kurz, Erneuerungstoken rotierend.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.sessions]
# Entscheidung 2026-11-25: 30 Tage, gleitend.
# ACHTUNG: Am echten Projekt NICHT wirksam - Supabase bietet die Sitzungssteuerung
# erst ab Pro an. Auf dem kostenlosen Tarif steht sie auf 0 (nie). Siehe Abweichung
# in features/PROJ-1-...md. Lokal gilt der Wert.
inactivity_timeout = "720h"

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
# Entscheidung 2026-11-25: Anmeldelink 60 Minuten gültig.
# Gegenmaßnahme gegen geteilte Büropostfächer: nur einmal verwendbar (Supabase-Standard)
# plus Versandbremse unten.
otp_expiry = 3600
otp_length = 8
max_frequency = "60s"

[auth.rate_limit]
# Der eingebaute Mailversand von Supabase ist fest auf 2 Mails pro Stunde begrenzt
# und laesst sich nur mit eigenem SMTP aendern. Lokal hier derselbe Wert, damit die
# Entwicklung nicht grosszuegiger ist als die Produktion.
email_sent = 2

[inbox]
enabled = true
port = 54324
